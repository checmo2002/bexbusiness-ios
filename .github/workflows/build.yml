name: Build thử iPhone, iPad, Mac
on:
  push:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-26' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: xcodebuild -version
      - name: Build cho máy ảo iPhone (không ký)
        run: |
          xcodebuild -project BexBusiness.xcodeproj -scheme BexBusiness -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Build cho iPhone thật (không ký)
        run: |
          xcodebuild -project BexBusiness.xcodeproj -scheme BexBusiness -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build | tee build2.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build2.log
      - name: Build cho Mac (Mac Catalyst, không ký)
        run: |
          xcodebuild -project BexBusiness.xcodeproj -scheme BexBusiness -configuration Release \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            CODE_SIGNING_ALLOWED=NO build | tee build3.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build3.log

  screenshots:
    needs: build
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Chạy máy chủ BexBusiness bản mới nhất
        run: |
          curl -sL https://raw.githubusercontent.com/checmo2002/bexbusiness-releases/main/latest.json -o latest.json
          F=$(python3 -c "import json;print(json.load(open('latest.json'))['server']['file'])")
          curl -sL "https://raw.githubusercontent.com/checmo2002/bexbusiness-releases/main/$F" -o server.pack
          python3 - <<'PY'
          import gzip, json, base64, os
          p = json.loads(gzip.decompress(open('server.pack','rb').read()))
          for rel, b in p['files'].items():
              f = os.path.join('srv', rel); os.makedirs(os.path.dirname(f), exist_ok=True); open(f,'wb').write(base64.b64decode(b))
          PY
          cd srv && (PORT=3999 BEX_DATA_DIR=$RUNNER_TEMP/data nohup node server.js > ../server.log 2>&1 &) && sleep 3 && curl -s localhost:3999/api/state
      - name: Build, cài lên máy ảo iPhone/iPad và chụp màn hình
        run: |
          xcodebuild -project BexBusiness.xcodeproj -scheme BexBusiness -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath dd CODE_SIGNING_ALLOWED=NO build -quiet
          APP=dd/Build/Products/Debug-iphonesimulator/BexBusiness.app
          DEV=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print([x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone 16') and 'Plus' not in x['name'] and 'e' != x['name'][-1]][0])")
          xcrun simctl boot $DEV && xcrun simctl bootstatus $DEV -b
          xcrun simctl status_bar $DEV override --time 9:41 --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          xcrun simctl install $DEV $APP
          mkdir -p screenshots
          xcrun simctl launch $DEV vn.beso.bexbusiness && sleep 6
          xcrun simctl io $DEV screenshot screenshots/1-chon-may-chu.png
          xcrun simctl terminate $DEV vn.beso.bexbusiness
          xcrun simctl spawn $DEV defaults write vn.beso.bexbusiness bex.serverURL -string http://localhost:3999
          xcrun simctl launch $DEV vn.beso.bexbusiness && sleep 10
          xcrun simctl io $DEV screenshot screenshots/2-trang-may-chu.png
          xcrun simctl shutdown $DEV || true
          # iPad: dọc đã rộng hơn 760pt nên trang web hiện bố cục máy tính
          PAD=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];v=[x for k,l in d.items() if 'iOS' in k for x in l if x['name'].startswith('iPad')];p=[x for x in v if x['name'].startswith('iPad Pro 11')] or [x for x in v if x['name'].startswith('iPad Air')] or v;print(p[0]['udid'])")
          xcrun simctl boot $PAD && xcrun simctl bootstatus $PAD -b
          xcrun simctl status_bar $PAD override --time 9:41 --batteryLevel 100 --wifiBars 3 || true
          xcrun simctl install $PAD $APP
          xcrun simctl launch $PAD vn.beso.bexbusiness && sleep 6
          xcrun simctl io $PAD screenshot screenshots/3-ipad-chon-may-chu.png
          xcrun simctl terminate $PAD vn.beso.bexbusiness
          xcrun simctl spawn $PAD defaults write vn.beso.bexbusiness bex.serverURL -string http://localhost:3999
          xcrun simctl launch $PAD vn.beso.bexbusiness && sleep 10
          xcrun simctl io $PAD screenshot screenshots/4-ipad-trang-may-chu.png
          xcrun simctl shutdown $PAD || true
      - name: Build bản Mac (ký tạm ad-hoc), mở và chụp màn hình
        continue-on-error: true
        run: |
          xcodebuild -project BexBusiness.xcodeproj -scheme BexBusiness -configuration Debug \
            -destination 'platform=macOS,variant=Mac Catalyst' -derivedDataPath ddmac \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= CODE_SIGNING_REQUIRED=NO build -quiet
          MAC=$(ls -d ddmac/Build/Products/Debug-maccatalyst/BexBusiness.app)
          open "$MAC" && sleep 8
          screencapture -x screenshots/5-mac-chon-may-chu.png
          osascript -e 'quit app "BexBusiness"' || pkill -x BexBusiness || true
          sleep 2
          # app Mac chạy trong sandbox: cài đặt nằm trong thư mục Containers
          defaults write "$HOME/Library/Containers/vn.beso.bexbusiness/Data/Library/Preferences/vn.beso.bexbusiness" bex.serverURL -string http://localhost:3999
          open "$MAC" && sleep 12
          screencapture -x screenshots/6-mac-trang-may-chu.png
          osascript -e 'quit app "BexBusiness"' || pkill -x BexBusiness || true
      - name: Lưu ảnh vào repo
        run: |
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add screenshots && git commit -m "Ảnh chụp máy ảo iPhone [skip ci]" && git push || true
